<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitZone Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-box{
    width:350px;
    background:#111;
    color:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(255,255,255,0.2);
    text-align:center;
}

.login-box h2{
    margin-bottom:20px;
    color:#ff6600;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #555;
    border-radius:5px;
    font-size:16px;
    background:#222;
    color:white;
}

input::placeholder{
    color:#aaa;
}

button{
    width:100%;
    padding:12px;
    background:#ff6600;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#e65c00;
}

a{
    text-decoration:none;
    color:#ff6600;
}

p{
    margin-top:15px;
}

@media (max-width:480px){
    .login-box{
        width:90%;
        padding:20px;
    }

    h2{
        font-size:24px;
    }

    input,
    button{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <h2>FitZone Login</h2>

    <form>
        <input type="tel" placeholder="Mobile Number" required>
        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p><a href="#">Forgot Password?</a></p>
    <p>Don't have an account? <a href="#">Register</a></p>

</div>

</body>
</html>
